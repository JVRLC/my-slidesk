<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Desk | Cosmic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }
        .glass-card:hover {
            background: rgba(51, 65, 85, 0.6);
            border-color: rgba(129, 140, 248, 0.5);
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .accent-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="p-8 relative">
    <div class="glow top-[-100px] right-[-100px]"></div>
    <div class="glow bottom-[-100px] left-[-100px]"></div>

    <div class="max-w-6xl mx-auto relative">
        <header class="mb-20 text-center">
            <h1 class="text-6xl font-extrabold mb-6 tracking-tight text-gradient">
                Slide <span class="accent-gradient">Desk</span>
            </h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto font-light leading-relaxed">
                Ma bibliothèque de présentations haute définition.
            </p>
        </header>

        <div id="slides-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Les cartes sont générées ici -->
        </div>
    </div>

    <script>
        // CONFIGURATION DES SLIDES
        const slides = [
            {
                title: "Présentation Démo",
                description: "Exploration des capacités de Slidev et intégration du portail cosmic.",
                path: "/my-slidesk/demo-presentation/",
                date: "Octobre 2026",
                tags: ["Architecture", "Design"]
            },
        ];

        const grid = document.getElementById('slides-grid');

        if (slides.length === 0) {
            grid.innerHTML = '<p class="text-center col-span-full text-slate-500">Aucune présentation disponible pour le moment.</p>';
        } else {
            slides.forEach(slide => {
                const card = document.createElement('a');
                card.href = slide.path;
                card.className = 'glass-card p-8 rounded-3xl block group';

                card.innerHTML = \`
                    <div class="flex flex-col h-full">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg group-hover:rotate-12 transition-transform">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 12h18M3 5h18M3 19h18"></path>
                                </svg>
                            </div>
                            <span class="text-xs font-medium text-slate-500">\${slide.date}</span>
                        </div>
                        <h2 class="text-2xl font-bold mb-3 text-white group-hover:text-indigo-300 transition-colors">\${slide.title}</h2>
                        <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">\${slide.description}</p>
                        <div class="flex flex-wrap gap-2">
                            \${slide.tags.map(tag => \`<span class="text-[10px] uppercase tracking-wider px-2 py-1 bg-white/5 text-slate-300 border border-white/10 rounded-md">\${tag}</span>\`).join('')}
                        </div>
                    </div>
                \`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>

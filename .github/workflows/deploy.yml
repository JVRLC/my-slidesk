name: Deploy Slidev Desk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build all presentations
        run: |
          mkdir -p dist
          cp index.html dist/

          # 1. Générer le fichier slides.json automatiquement
          echo "[]" > dist/slides.json

          for dir in slides/*/; do
            if [ -d "$dir" ]; then
              dir_name=$(basename "$dir")
              echo "Building $dir_name..."

              # On extrait le titre depuis le premier H1 du fichier slides.md
              TITLE=$(grep '^# ' "$dir/slides.md" | head -n 1 | sed 's/^# //')
              [ -z "$TITLE" ] && TITLE=$dir_name

              # On crée une entrée JSON pour cette slide
              # Note: On utilise un format simple pour le JSON
              echo "{\"title\": \"$TITLE\", \"folder\": \"$dir_name\", \"description\": \"Présentation $TITLE\", \"date\": \"$(date +'%B %Y')\", \"tags\": [\"Slidev\"]}" >> slides_tmp.json

              # Build de la slide
              npx slidev build "$dir/slides.md" --base "/my-slidesk/$dir_name/" --out "$GITHUB_WORKSPACE/dist/$dir_name"
            fi
          done

          # Convertir la liste temporaire en un vrai tableau JSON
          # On utilise jq si disponible, sinon une astuce sed/awk
          if command -v jq >/dev/null 2>&1; then
            jq -s '.' slides_tmp.json > dist/slides.json
          else
            # Fallback minimaliste si jq n'est pas là
            sed 's/$/,/' slides_tmp.json | sed '$ s/,$//' | sed 's/^/[\n/' | sed '$ s/$/\n]/' > dist/slides.json
          fi
          rm -f slides_tmp.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
